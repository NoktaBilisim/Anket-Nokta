version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: surveypro_postgres
    environment:
      POSTGRES_DB: surveypro
      POSTGRES_USER: surveypro
      POSTGRES_PASSWORD: surveypro123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surveypro"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: surveypro_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: surveypro_backend
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      PORT: 5001
      UPLOAD_DIR: /app/uploads/logos
      MAX_LOGO_SIZE_MB: 2
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads_data:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: surveypro_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  pgadmin:
    image: dpage/pgadmin4
    container_name: surveypro_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@surveypro.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
  uploads_data:
