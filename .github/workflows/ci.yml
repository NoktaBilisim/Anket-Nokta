name: CI/CD Pipeline - SurveyPro

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Statik Kod Analizi ve Sözdizimi Kontrolü ──────────────────────────────
  lint-and-syntax:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      - name: Check Backend Syntax
        working-directory: ./backend
        run: |
          npm ci || npm install
          npm test

      - name: Check Frontend Syntax
        working-directory: ./frontend
        run: |
          npm ci || npm install
          npm test

  # ── 2. Frontend Üretim Derleme Testi ─────────────────────────────────────────
  build-frontend:
    name: Frontend Vite Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Build Frontend SPA
        working-directory: ./frontend
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          test -f frontend/dist/index.html || { echo "HATA: frontend/dist/index.html bulunamadı"; exit 1; }
          echo "✓ Frontend build çıktısı başarıyla doğrulandı."

  # ── 3. Güvenlik ve Bağımlılık Taraması ────────────────────────────────────────
  security-audit:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Git Secret & Credential Leak Scan
        run: |
          echo "Gizli anahtar taraması yapılıyor..."
          # Hassas private key veya JWT secret sızıntı kontrolü
          if git grep -E "(BEGIN RSA PRIVATE KEY|BEGIN OPENSSH PRIVATE KEY)" -- ':!*.md' ':!docs/**'; then
            echo "KRİTİK HATA: Repoda açık özel anahtar tespit edildi!"
            exit 1
          fi
          echo "✓ Gizli bilgi taraması temiz."

      - name: Backend Dependency Audit (Audit Check)
        working-directory: ./backend
        run: |
          npm ci || npm install
          npm audit --audit-level=critical || echo "Uyarı: Backend bağımlılıklarında dikkat gerektiren bulgular var."

      - name: Frontend Dependency Audit (Audit Check)
        working-directory: ./frontend
        run: |
          npm ci || npm install
          npm audit --audit-level=critical || echo "Uyarı: Frontend bağımlılıklarında dikkat gerektiren bulgular var."

  # ── 4. Docker İmaj Derleme Testi (Build Validation) ───────────────────────────
  docker-build-test:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: [lint-and-syntax, build-frontend]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          docker build -t surveypro-backend:test -f docker/Dockerfile.backend .

      - name: Build Frontend Production Docker Image
        run: |
          docker build -t surveypro-frontend:test -f docker/Dockerfile.frontend.prod .

      - name: Validate Docker Compose Config
        run: |
          docker compose -f docker-compose.yml config > /dev/null
          docker compose -f docker-compose.prod.yml config > /dev/null
          echo "✓ Docker compose yapılandırmaları geçerli."

  # ── 5. Otomatik Dağıtım (Publish Sunucusu Deploy - Opsiyonel/Onaylı) ─────────
  deploy-production:
    name: Deploy to Production (185.126.217.99)
    needs: [security-audit, docker-build-test]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://anket.noktabilisim.net
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH Keys
        if: env.SSH_PRIVATE_KEY != ''
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 185.126.217.99 >> ~/.ssh/known_hosts

      - name: Trigger Remote Deploy
        if: env.SSH_PRIVATE_KEY != ''
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "Uzak sunucuya dağıtım tetikleniyor..."
          ssh root@185.126.217.99 "cd /opt/anket && docker compose -f docker-compose.prod.yml pull || true && docker compose -f docker-compose.prod.yml up --build -d"
          echo "✓ Dağıtım komutu iletildi."
